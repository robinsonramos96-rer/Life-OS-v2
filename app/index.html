<style>@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/hanken-grotesk-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/hanken-grotesk-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/hanken-grotesk-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/hanken-grotesk-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Newsreader';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/newsreader-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Newsreader';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/newsreader-latin-500-normal.woff2) format('woff2')}</style><style>/* Layout: sidebar + main column of cards on desktop; bottom tab bar on phones. Serif for figures, grotesk for UI. */
:root {
  --bg: #f3f4f7; --panel: #ffffff; --panel-2: #f7f8fa; --line: #e1e4ea; --line-strong: #cdd2db;
  --fg: #171b24; --muted: #596273; --faint: #8b93a1; --accent: #2b4c9b; --accent-ink: #ffffff; --accent-soft: #e6ecf8;
  --ok: #2f7d4f; --warn: #a86b12; --bad: #c0362c; --bad-soft: #fbe9e7; --warn-soft: #fbf1dd; --ok-soft: #e4f2e9;
  --d1: #6a58cc; --d2: #d4613a; --d3: #b78410; --d4: #3a77ad; --d5: #c4405d; --d6: #1e8669; --d7: #74851c;
  --d8: #8a4fa8; --d9: #2f8aa0; --d10: #a2652c; --d11: #4f6a8f; --d12: #b0476f;
  --shadow: 0 1px 2px rgba(20, 26, 38, .05), 0 4px 16px rgba(20, 26, 38, .05);
  --pop: 0 8px 28px rgba(20, 26, 38, .18);
  --font-ui: 'Hanken Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-fig: 'Newsreader', 'Iowan Old Style', Georgia, serif;
  --r: 10px; --r-sm: 7px;
  --tk: 1; --fs-cap: calc(12px * var(--tk)); --fs-body: calc(14px * var(--tk)); --fs-h: calc(16px * var(--tk)); --fs-title: calc(30px * var(--tk));
  --pad: 16px; --gap: 18px; --row-y: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --panel: #161a21; --panel-2: #1b2029; --line: #272d38; --line-strong: #353c49;
    --fg: #e6e9ef; --muted: #a2aab8; --faint: #747d8c; --accent: #8ea8ee; --accent-ink: #0e1116; --accent-soft: #1e2638;
    --ok: #6cc28f; --warn: #e0a84a; --bad: #f07a6e; --bad-soft: #3a1f1d; --warn-soft: #36290f; --ok-soft: #16301f;
    --d1: #a597f0; --d2: #f0a07e; --d3: #e3bb55; --d4: #83b4e0; --d5: #ee8ea3; --d6: #6ccfb2; --d7: #bfd067;
    --d8: #c99be0; --d9: #7fcfe0; --d10: #e0ad7c; --d11: #a3b8d6; --d12: #ee93b6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --pop: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --panel: #161a21; --panel-2: #1b2029; --line: #272d38; --line-strong: #353c49;
  --fg: #e6e9ef; --muted: #a2aab8; --faint: #747d8c; --accent: #8ea8ee; --accent-ink: #0e1116; --accent-soft: #1e2638;
  --ok: #6cc28f; --warn: #e0a84a; --bad: #f07a6e; --bad-soft: #3a1f1d; --warn-soft: #36290f; --ok-soft: #16301f;
  --d1: #a597f0; --d2: #f0a07e; --d3: #e3bb55; --d4: #83b4e0; --d5: #ee8ea3; --d6: #6ccfb2; --d7: #bfd067;
  --d8: #c99be0; --d9: #7fcfe0; --d10: #e0ad7c; --d11: #a3b8d6; --d12: #ee93b6;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --pop: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 var(--fs-body)/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.num, td.num, .tab { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* shell */
.shell { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 14px; }
.brand b { font: 500 calc(22px * var(--tk))/1 var(--font-fig); letter-spacing: -.01em; }
.brand span { font-size: var(--fs-cap); color: var(--faint); }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: var(--r-sm); background: none; cursor: pointer; text-align: left; color: var(--muted); }
.nav-btn:hover { background: var(--panel-2); color: var(--fg); }
.nav-btn.on { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.nav-btn .badge { margin-left: auto; }
.nav-sep { height: 1px; background: var(--line); margin: 10px 6px; }
.side-foot { margin-top: auto; padding: 10px; font-size: var(--fs-cap); color: var(--faint); display: grid; gap: 6px; }
.main { min-width: 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 1240px; margin-inline: auto; display: grid; gap: var(--gap); }
.topbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.topbar h1 { margin: 0; font: 400 var(--fs-title)/1.1 var(--font-fig); letter-spacing: -.01em; text-wrap: balance; }
.topbar .sub { color: var(--muted); margin-top: 4px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tabbar { display: none; }

/* controls */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--panel-2); }
.btn.sm { padding: 4px 9px; font-size: var(--fs-cap); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: default; }
input.text, select.sel, textarea.text { width: 100%; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--panel); }
textarea.text { min-height: 80px; resize: vertical; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 11px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; font-size: var(--fs-cap); color: var(--fg); white-space: nowrap; }
.chip.on { border-color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 14%, var(--panel)); }
.chip.off { border-style: dashed; color: var(--faint); }
.chip .x { color: var(--faint); }
.chip-label { font-size: var(--fs-cap); color: var(--faint); min-width: 58px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--faint)); flex: none; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font-size: calc(11px * var(--tk)); color: var(--muted); font-variant-numeric: tabular-nums; }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: calc(11px * var(--tk)); font-weight: 600; letter-spacing: .02em; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.muted { color: var(--muted); } .faint { color: var(--faint); } .cap { font-size: var(--fs-cap); }
.bad-t { color: var(--bad); } .warn-t { color: var(--warn); } .ok-t { color: var(--ok); }

/* filter bar */
.filterbar { display: grid; gap: 8px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.filterrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* cards */
.grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); align-items: start; }
.grid.two { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: var(--pad); min-width: 0; box-shadow: var(--shadow); }
.card h2, .card h3 { margin: 0; font-size: var(--fs-h); font-weight: 600; }
.card .note { margin: 3px 0 0; color: var(--muted); font-size: var(--fs-cap); }
.card-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; margin-bottom: calc(var(--pad) * .75); }
.kpis { display: grid; gap: calc(var(--gap) * .67); grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: calc(var(--pad) * .75) calc(var(--pad) * .875); box-shadow: var(--shadow); cursor: pointer; text-align: left; }
.kpi .lbl { font-size: var(--fs-cap); color: var(--muted); }
.kpi .val { font: 400 calc(32px * var(--tk))/1.1 var(--font-fig); margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .val.bad { color: var(--bad); }
.kpi .sub { font-size: var(--fs-cap); color: var(--faint); margin-top: 2px; }
.empty { color: var(--faint); font-size: var(--fs-cap); padding: 8px 0; }

/* rows */
.rows { display: grid; }
.row { display: flex; align-items: center; gap: 10px; padding: var(--row-y) 2px; border-bottom: 1px solid var(--line); min-width: 0; }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .title { cursor: pointer; overflow-wrap: anywhere; }
.row .title:hover { color: var(--accent); }
.row .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: var(--fs-cap); color: var(--muted); margin-top: 2px; }
.row.done .title { text-decoration: line-through; color: var(--faint); }
.check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: none; cursor: pointer; flex: none; display: grid; place-items: center; padding: 0; }
.check:hover { border-color: var(--accent); }
.check.on { background: var(--ok); border-color: var(--ok); }
.check.on::after { content: ''; width: 8px; height: 4px; border: 2px solid var(--panel); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.stripe { width: 3px; align-self: stretch; border-radius: 2px; background: var(--c, var(--faint)); flex: none; }
.day-head { font-size: var(--fs-cap); font-weight: 600; color: var(--muted); padding: 10px 0 2px; text-transform: uppercase; letter-spacing: .05em; }
.day-head.today { color: var(--accent); }
.inline-num { width: 92px; padding: 4px 8px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--panel); font-size: var(--fs-cap); }

/* table */
.tbox { overflow: auto; max-height: 560px; }
table.t { width: 100%; border-collapse: collapse; font-size: var(--fs-body); font-variant-numeric: tabular-nums; }
table.t th { position: sticky; top: 0; background: var(--panel); text-align: left; font-size: var(--fs-cap); font-weight: 600; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
table.t th button { all: unset; cursor: pointer; }
table.t td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:hover td { background: var(--panel-2); }
@container (max-width: 560px) { .hide-sm { display: none; } }
.show-sm { display: none; }
@container (max-width: 560px) { .show-sm { display: block; margin-top: 2px; } }
.cq { container-type: inline-size; }

/* life grid */
.lifegrid { display: grid; grid-template-columns: minmax(120px, 1.2fr) repeat(5, minmax(0, 1fr)); gap: 4px; }
.lg-h { font-size: var(--fs-cap); color: var(--muted); padding: 2px 4px; align-self: end; }
.lg-d { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: var(--fs-cap); cursor: pointer; padding: 0 4px; }
.lg-c { border-radius: var(--r-sm); padding: 8px; text-align: center; font: 400 calc(18px * var(--tk))/1.1 var(--font-fig); background: color-mix(in srgb, var(--c) calc(var(--k) * 26%), var(--panel-2)); border: 1px solid transparent; font-variant-numeric: tabular-nums; }
.lg-c.bad { border-color: var(--bad); color: var(--bad); }
.lg-c small { display: block; font: 500 calc(10.5px * var(--tk))/1.2 var(--font-ui); color: var(--muted); margin-top: 2px; }

/* calendar */
.cal-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.cal-title { font: 400 calc(24px * var(--tk))/1.1 var(--font-fig); }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--line); gap: 1px; }
.month .dow { background: var(--panel-2); padding: 6px 8px; font-size: var(--fs-cap); color: var(--muted); font-weight: 600; }
.mcell { background: var(--panel); min-height: 112px; padding: 6px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.mcell.other { background: var(--panel-2); }
.mcell.other .dnum { color: var(--faint); }
.mcell.over { box-shadow: inset 0 2px 0 var(--bad); }
.mcell.drop { outline: 2px dashed var(--accent); outline-offset: -3px; }
.dnum { font-size: var(--fs-cap); font-weight: 600; display: flex; justify-content: space-between; color: var(--muted); }
.dnum.today b { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; }
.ent { display: flex; align-items: center; gap: 5px; font-size: calc(11.5px * var(--tk)); line-height: 1.25; padding: 2px 6px; border-radius: 5px; background: color-mix(in srgb, var(--c) 14%, var(--panel)); border-left: 3px solid var(--c); cursor: pointer; min-width: 0; }
.ent span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ent .k { color: var(--muted); font-size: calc(10.5px * var(--tk)); flex: none; }
.ent.deadline { background: none; border: 1px dashed var(--c); border-left: 3px solid var(--c); }
.ent.log { background: none; border-left-color: transparent; color: var(--muted); }
.ent.done span.t { text-decoration: line-through; color: var(--faint); }
.ent.log span.t { text-decoration: none; color: var(--muted); }
.dbtn { all: unset; cursor: pointer; padding: 0 2px; border-radius: 999px; }
.dbtn:hover { color: var(--accent); }
.dnum.today .dbtn { background: var(--accent); color: var(--accent-ink); padding: 0 7px; }
.ent.overdue { box-shadow: inset 0 0 0 1px var(--bad); }
.more { font-size: calc(11px * var(--tk)); color: var(--accent); cursor: pointer; background: none; border: 0; text-align: left; padding: 0 6px; }
/* the calendar's week: a column per day; rows are parts of the day or hours (beta 11: its own class, so the Home
   planner's .week rules no longer squeeze it into seven columns) */
.cal-scroll { overflow-x: auto; overscroll-behavior-x: contain; }
.calweek { display: grid; grid-template-columns: 84px repeat(7, minmax(92px, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--line); gap: 1px; min-width: 720px; }
.calweek > div, .calweek > button { background: var(--panel); padding: 6px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.calweek .wh { background: var(--panel-2); font-size: var(--fs-cap); font-weight: 600; color: var(--muted); border: 0; text-align: left; cursor: pointer; position: sticky; top: 0; }
.calweek .wh.today { color: var(--accent); }
.calweek .band { background: var(--panel-2); font-size: var(--fs-cap); color: var(--muted); justify-content: center; position: sticky; left: 0; z-index: 1; }
.calweek .band b { font-weight: 600; color: var(--fg); }
.calweek .band small { font-size: calc(10.5px * var(--tk)); color: var(--faint); }
.calweek .wcell { min-height: 64px; }
.calweek .wcell.today { background: color-mix(in srgb, var(--accent) 4%, var(--panel)); }
.calweek.parts .band.part ~ .wcell[data-act] { min-height: 96px; }
.calweek .wcell[data-act] { cursor: copy; }
.calweek .wcell[data-act]:empty:hover { background: var(--accent-soft); }
.calweek.hours .wcell { min-height: 38px; padding: 3px 5px; }
.calweek.hours .band.hr { justify-content: flex-start; padding-top: 4px; }
.calweek .wcell.drop { outline: 2px dashed var(--accent); outline-offset: -3px; }
.yeargrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.ym h4 { margin: 0 0 6px; font-size: var(--fs-cap); font-weight: 600; }
.ym .g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.yd { aspect-ratio: 1; border-radius: 3px; background: color-mix(in srgb, var(--accent) calc(var(--k) * 22%), var(--panel-2)); font-size: calc(9.5px * var(--tk)); display: grid; place-items: center; color: var(--muted); cursor: pointer; position: relative; border: 0; padding: 0; }
.yd.blank { background: none; cursor: default; }
.yd.mark::after { content: ''; position: absolute; right: 1px; top: 1px; width: 4px; height: 4px; border-radius: 50%; background: var(--bad); }
.yd.today { outline: 1.5px solid var(--accent); }

/* gantt */
.gantt { display: grid; gap: 0; }
.g-row { display: grid; grid-template-columns: minmax(130px, 32%) minmax(0, 1fr); align-items: center; min-height: 30px; border-bottom: 1px solid var(--line); }
.g-row.head { min-height: 26px; border-bottom: 1px solid var(--line-strong); }
.g-lbl { font-size: var(--fs-cap); padding-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.g-lbl.grp { font-weight: 600; color: var(--muted); cursor: default; }
.g-track { position: relative; height: 100%; min-height: 26px; }
.g-bar { position: absolute; top: 50%; height: 12px; transform: translateY(-50%); border-radius: 6px; background: var(--c); min-width: 6px; cursor: pointer; }
.g-bar.open { background: color-mix(in srgb, var(--c) 30%, var(--panel)); border: 1px solid var(--c); }
.g-dia { position: absolute; top: 50%; width: 11px; height: 11px; transform: translate(-50%, -50%) rotate(45deg); background: var(--c); cursor: pointer; }
.g-today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px dashed var(--accent); pointer-events: none; }
.g-tick { position: absolute; top: 4px; font-size: calc(10.5px * var(--tk)); color: var(--faint); transform: translateX(2px); white-space: nowrap; }
.g-grid { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); }

/* heat map */
.heat { display: grid; grid-template-columns: 22px repeat(5, minmax(0, 1fr)); gap: 3px; }
.hc { min-height: 50px; border-radius: 6px; padding: 3px; display: flex; flex-wrap: wrap; gap: 3px; align-content: flex-start; }
.hc.lo { background: color-mix(in srgb, var(--faint) 12%, var(--panel)); }
.hc.mid { background: var(--warn-soft); }
.hc.hi { background: var(--bad-soft); }
.hx { font-size: calc(11px * var(--tk)); color: var(--muted); text-align: center; align-self: center; }
.hchip { font-size: calc(11px * var(--tk)); padding: 0 5px; border-radius: 5px; background: var(--panel); border: 1px solid var(--line-strong); cursor: pointer; }

/* horizons */
.horizons { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.hcol { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; align-content: start; }
.hcol h4 { margin: 0; font-size: var(--fs-cap); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.gcard { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: var(--r-sm); padding: 8px 10px; cursor: pointer; }
.gcard b { font-weight: 600; }

/* bars, charts */
.hbar { display: grid; grid-template-columns: 80px minmax(0, 1fr) 30px; gap: 10px; align-items: center; font-size: var(--fs-cap); }
.hbar .track { display: flex; height: 16px; border-radius: 5px; overflow: hidden; background: var(--panel-2); }
.hbar .track i { display: block; height: 100%; background: var(--c); }
.spark { width: 100%; height: 90px; display: block; }
.spark-lbls { display: flex; justify-content: space-between; font-size: calc(10.5px * var(--tk)); color: var(--faint); }
.metric-val { font: 400 calc(28px * var(--tk))/1 var(--font-fig); font-variant-numeric: tabular-nums; }

/* domain cards */
.dcard { border-top: 3px solid var(--c); cursor: pointer; display: grid; gap: 8px; }
.dcard h3 { font: 400 calc(20px * var(--tk))/1.1 var(--font-fig); }
.dstats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--fs-cap); color: var(--muted); }
.dstats b { color: var(--fg); font-variant-numeric: tabular-nums; }

/* drawer, modal, search, toast */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 22, .32); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--pop); z-index: 41; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.drawer-body { overflow-y: auto; padding: 16px; display: grid; gap: 12px; align-content: start; }
.drawer-foot { display: flex; gap: 8px; justify-content: space-between; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.field { display: grid; gap: 4px; }
.field > span { font-size: var(--fs-cap); color: var(--muted); font-weight: 600; }
.fields2 { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.checkline { display: flex; gap: 8px; align-items: center; }
.modal { position: fixed; left: 50%; top: 8vh; transform: translateX(-50%); width: min(640px, calc(100% - 24px)); max-height: 84vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--pop); z-index: 41; padding: 18px; display: grid; gap: 12px; }
.modal h2 { margin: 0; font: 400 calc(24px * var(--tk))/1.1 var(--font-fig); }
.search-box { position: fixed; left: 50%; top: 10vh; transform: translateX(-50%); width: min(620px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--pop); z-index: 41; overflow: hidden; }
.search-box input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; background: none; font-size: calc(16px * var(--tk)); outline: none; }
.search-res { max-height: 60vh; overflow: auto; padding: 6px; }
.sres { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; }
.sres:hover { background: var(--panel-2); }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; z-index: 60; font-size: var(--fs-cap); box-shadow: var(--pop); }
.banner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: var(--r); background: var(--accent-soft); font-size: var(--fs-cap); }
.qa { display: flex; gap: 8px; }
.qa input { flex: 1; }
.qa-preview { display: flex; flex-wrap: wrap; gap: 6px; font-size: var(--fs-cap); color: var(--muted); min-height: 20px; margin-top: 6px; }
.split { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: start; }
.lists { display: grid; gap: 2px; position: sticky; top: 16px; }
.steps { display: grid; gap: 12px; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; }
.step .n { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-weight: 600; font-size: var(--fs-cap); cursor: pointer; background: var(--panel); }
.step .n.on { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 84px 14px minmax(0, 1fr); gap: 10px; padding: 6px 0; }
.tl .d { font-size: var(--fs-cap); color: var(--muted); text-align: right; }
.tl .m { width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-top: 4px; }
code.blk { display: block; white-space: pre; overflow-x: auto; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; font-size: calc(12px * var(--tk)); }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--panel); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
  .tabbar button { border: 0; background: none; padding: 6px 2px; font-size: calc(11px * var(--tk)); color: var(--muted); display: grid; gap: 2px; justify-items: center; cursor: pointer; }
  .tabbar button.on { color: var(--accent); font-weight: 600; }
  .tabbar svg { width: 20px; height: 20px; }
  .grid.two { grid-template-columns: minmax(0, 1fr); }
  .split { grid-template-columns: minmax(0, 1fr); }
  .lists { position: static; display: flex; flex-wrap: wrap; gap: 6px; }
  .lists .nav-btn { width: auto; border: 1px solid var(--line); }
  .mcell { min-height: 74px; padding: 4px; }
  .ent .k { display: none; }
  .calweek { grid-template-columns: 58px repeat(7, minmax(84px, 1fr)); font-size: calc(11px * var(--tk)); }
  .lifegrid { grid-template-columns: minmax(92px, 1.1fr) repeat(5, minmax(0, 1fr)); }
  .lg-c { padding: 6px 2px; font-size: calc(15px * var(--tk)); }
  .topbar h1 { font-size: calc(26px * var(--tk)); }
}
@media (max-width: 560px) {
  .month .dow { padding: 4px; font-size: calc(10.5px * var(--tk)); }
  .month .mcell { flex-direction: row; flex-wrap: wrap; align-content: flex-start; gap: 4px; min-height: 64px; }
  .month .dnum { width: 100%; }
  .month .ent { width: 9px; height: 9px; padding: 0; border: 0; border-radius: 50%; background: var(--c); }
  .month .ent.deadline { background: none; box-shadow: inset 0 0 0 1.5px var(--c); border: 0; }
  .month .ent .k, .month .ent span.t { display: none; }
  .month .more { width: 100%; padding: 0; }
  .ent { font-size: calc(10.5px * var(--tk)); padding: 1px 4px; }
  .fields2 { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slidein .18s ease-out; }
  @keyframes slidein { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}

/* IDs */
.ref { font: 600 calc(11px * var(--tk))/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .02em; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; white-space: nowrap; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.top-banner { margin-bottom: 14px; }
.banner.bad-b { background: var(--bad-soft); }

/* sign in and sign up */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; gap: 10px; align-content: center; }
.auth-card { width: min(460px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 26px 24px; display: grid; gap: 12px; }
.auth-card h1 { margin: 0; font: 400 calc(28px * var(--tk))/1.15 var(--font-fig); letter-spacing: -.01em; text-wrap: balance; }
.auth-card p { margin: 0; }
.auth-brand { display: flex; align-items: center; gap: 10px; }
.auth-brand svg { width: 32px; height: 32px; }
.auth-brand b { font: 500 calc(22px * var(--tk))/1 var(--font-fig); }
.auth-form { display: grid; gap: 12px; }
.auth-msg { min-height: 1.4em; color: var(--bad); font-size: var(--fs-cap); }
.auth-msg:empty { display: none; }
.auth-alt, .auth-foot { font-size: var(--fs-cap); color: var(--muted); }
.auth-foot { text-align: center; }
.auth-links { display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; }
.btn.big { padding: 11px 16px; font-size: calc(15px * var(--tk)); font-weight: 600; }
.code-box summary { cursor: pointer; color: var(--accent); font-size: var(--fs-cap); }
.code-box[open] summary { margin-bottom: 8px; }
.pay-choice { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px 10px; margin: 0; display: grid; gap: 8px; }
.pay-choice legend { font-size: var(--fs-cap); color: var(--muted); padding: 0 4px; }
.radio, .check-line { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.radio input, .check-line input { margin-top: 3px; flex: none; width: 16px; height: 16px; accent-color: var(--accent); }
.check-line span { font-size: var(--fs-cap); color: var(--muted); }
.check-line b { color: var(--fg); font-size: var(--fs-body); }
.captcha { min-height: 66px; }

/* settings: accounts and domains */
.inline-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inline-form .text { flex: 1; min-width: 160px; }
.addr-row { display: flex; gap: 8px; align-items: center; }
.addr-row .text { flex: 1; min-width: 0; font-size: calc(13px * var(--tk)); }
.cheat { display: grid; gap: 6px; margin: 10px 0; }
.cheat div { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: var(--fs-cap); color: var(--muted); }
.cheat code { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.dom-list { display: grid; gap: 8px; }
.dom-row { display: grid; grid-template-columns: auto minmax(0, 1fr) 64px auto; gap: 6px 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.dom-row .areas { grid-column: 2 / -1; font-size: calc(13px * var(--tk)); }
.dom-row .code { text-transform: uppercase; text-align: center; padding-inline: 4px; }
.dom-btns { display: flex; gap: 2px; grid-column: 4; grid-row: 1; }
.dom-del { grid-column: 1 / -1; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--panel); outline: 1px solid var(--line-strong); background: var(--c); cursor: pointer; padding: 0; }
@media (max-width: 520px) {
  .dom-row { grid-template-columns: auto minmax(0, 1fr) 60px; }
  .dom-btns { grid-column: 2 / -1; grid-row: 3; justify-content: flex-end; }
}

/* first run */
.welcome .dots { display: flex; gap: 6px; justify-content: center; }
.welcome .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.welcome .dots span.on { background: var(--accent); }
.welcome .row.check-line { align-items: center; }
.tour { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.welcome .field { display: grid; gap: 6px; }

.gcard.connected { border-top-style: dashed; border-right-style: dashed; border-bottom-style: dashed; }
.gcard .conn { color: var(--accent); margin-top: 2px; }
.g-log { position: absolute; top: 50%; width: 3px; height: 14px; margin-left: -1.5px; transform: translateY(-50%); border-radius: 2px; background: var(--c); box-shadow: 0 0 0 1.5px var(--panel); cursor: pointer; z-index: 2; }
.wrap > .seg { justify-self: start; }

/* areas */
.area-chips { align-items: center; }
.area-list { display: grid; gap: 6px; }
.area-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 10px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
.area-sum { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.area-sum .cap { min-width: 0; overflow-wrap: anywhere; }
.dareas b { color: var(--fg); font-weight: 600; }
@media (max-width: 520px) { .area-row { grid-template-columns: minmax(0, 1fr) auto; } .area-row .area-btns { grid-column: 1 / -1; justify-content: flex-end; } }
.area-btns { display: flex; gap: 2px; }

/* Home: tasks lead; the safety net informs without shouting; cards fold */
.home-top { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--gap); align-items: start; }
.home-top .col { display: grid; gap: var(--gap); min-width: 0; align-content: start; }
@media (max-width: 900px) { .home-top { grid-template-columns: minmax(0, 1fr); } }
.home-card .card-head { align-items: center; }
.home-card .card-head .grow { flex: 1; min-width: 0; }
.home-card h2 { cursor: pointer; }
.fold { flex: none; width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; font-size: calc(12px * var(--tk)); align-self: flex-start; }
.fold:hover { color: var(--fg); border-color: var(--line-strong); }
.home-card.folded { padding-block: 10px; }
.home-card.folded .card-head { margin: 0; }
.fold-sum { font: 400 var(--fs-cap)/1.4 var(--font-ui); color: var(--muted); margin-left: 6px; }
.today-card .row { padding: calc(var(--row-y) + 3px) 2px; }
.today-card .row .title { font-size: calc(16px * var(--tk)); font-weight: 600; }
.today-card .check { width: 22px; height: 22px; }
.compact .row { padding: calc(var(--row-y) - 2px) 2px; }
.compact .row .title { font-size: calc(13.5px * var(--tk)); }
.compact .row .meta { font-size: calc(11px * var(--tk)); gap: 4px; margin-top: 1px; }
.compact .pill { font-size: calc(10px * var(--tk)); padding: 0 6px; letter-spacing: .01em; }
.compact .ref { font-size: calc(10px * var(--tk)); padding: 0 4px; opacity: .85; }
.compact .card-head .note { font-size: calc(11.5px * var(--tk)); }
.compact .ent { font-size: calc(11px * var(--tk)); }
.kpi { transition: border-color .12s, transform .12s; }
.kpi:hover { border-color: var(--accent); }
.kpi:active { transform: translateY(1px); }
.kpi.alert { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.kpi .sub::after { content: " ›"; color: var(--faint); }
.drill .rows { max-height: 56vh; overflow: auto; }

/* the week planner */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wk-day { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px; display: grid; gap: 6px; align-content: start; min-height: 150px; min-width: 0; background: var(--panel); }
.wk-day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.wk-day.drop { background: var(--accent-soft); }
.wk-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; border: 0; background: none; padding: 0; cursor: pointer; color: var(--fg); text-align: left; }
.wk-head b { font-size: calc(13px * var(--tk)); } .wk-head span { font-size: calc(11px * var(--tk)); color: var(--muted); }
.wk-day.today .wk-head b { color: var(--accent); }
.wk-load { height: 4px; border-radius: 2px; background: var(--panel-2); overflow: hidden; }
.wk-load i { display: block; height: 100%; background: color-mix(in srgb, var(--accent) 70%, var(--panel)); }
.wk-load i.over { background: var(--warn); }
.wk-items { display: grid; gap: 4px; min-width: 0; }
@media (max-width: 900px) {
  .week { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .wk-day { min-height: 0; grid-template-columns: 78px minmax(0, 1fr); align-items: start; }
  .wk-head { flex-direction: column; gap: 0; }
  .wk-load { grid-column: 1; grid-row: 2; }
  .wk-items { grid-column: 2; grid-row: 1 / span 2; }
}
.wk-items .ent { align-items: flex-start; }
.wk-items .ent .t { white-space: normal; overflow: visible; text-overflow: clip; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 560px) { .home-card .card-head { flex-wrap: wrap; } .home-card .card-head .top-actions { width: 100%; justify-content: flex-start; padding-left: 36px; } }

/* ── My Day: one panel on Home (Today) and in Tasks (My Day). Each group looks different on purpose. ── */
.md { display: grid; gap: 14px; }
.md-head { display: flex; align-items: center; gap: 7px; width: 100%; padding: 4px 0 6px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--muted); font: 700 var(--fs-cap)/1.3 var(--font-ui); text-transform: uppercase; letter-spacing: .05em; text-align: left; }
.md-head .md-ico { display: grid; place-items: center; width: 18px; height: 18px; flex: none; }
.md-head .md-ico svg { width: 16px; height: 16px; }
.md-head .md-sub { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--faint); text-align: right; }
.md-head.sun { color: var(--accent); }
.md-head.tap { cursor: pointer; }
.md-head.tap:hover { color: var(--fg); }
.md-head.tap::after { content: '▾'; margin-left: 6px; color: var(--faint); font-size: calc(11px * var(--tk)); }
.md-head.tap.shut::after { content: '▸'; margin-left: auto; }
.md .empty { padding: 12px 2px; text-align: left; }
.md-done .day-head { padding-top: 8px; }
.md-done .row { padding-block: 5px; }
.md-done .row .title { font-size: calc(13.5px * var(--tk)) !important; font-weight: 400 !important; }
/* schedule: the time leads, so an appointment never reads as a to-do */
.row.ev .when { flex: none; width: 62px; font-size: calc(13px * var(--tk)); font-weight: 600; color: var(--fg); }
.row.ev .stripe { align-self: stretch; }
.row.ev.done .when { color: var(--faint); }
/* suggestions: square boxes to select, quieter type, a soft fill when picked */
.sugg .day-head { padding-top: 8px; }
.row.sg { cursor: pointer; border-radius: 6px; padding-inline: 6px; }
.row.sg:hover { background: var(--panel-2); }
.row.sg.sel { background: var(--accent-soft); }
.row.sg .pick { width: 17px; height: 17px; margin: 0; flex: none; accent-color: var(--accent); cursor: pointer; }
.today-card .row.sg .title, .today-card .row.ev .title { font-size: calc(14.5px * var(--tk)); font-weight: 500; }
.today-card .row.sg { padding-block: 7px; }
.md-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 0 0; }
.md-bar .btn[disabled] { opacity: .5; cursor: default; }
.sg-group > .btn { margin: 4px 0 0 4px; }
/* the sun on any task row: add to My Day, or take it off */
.md-btn { flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--faint); cursor: pointer; display: grid; place-items: center; padding: 0; }
.md-btn svg { width: 17px; height: 17px; }
.md-btn:hover { color: var(--accent); border-color: var(--line); background: var(--panel-2); }
.md-btn.on { color: var(--accent); background: var(--accent-soft); }
.md-btn.on:hover { border-color: var(--accent); }
/* week planner legend: the marks on each chip */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 0; }
.legend b { font-weight: 600; color: var(--fg); margin-right: 3px; }
.ent.appt .k { color: var(--fg); font-weight: 600; }
@media (max-width: 560px) {
  .md-head .md-sub { display: none; }
  .row.ev .when { width: 54px; font-size: calc(12px * var(--tk)); }
  .row.sg .btn.ghost { padding-inline: 6px; }
}
@media (max-width: 900px) { .wk-items .ent .k { display: inline; } } /* the planner is a list here, so the marks fit */

/* ── The filter pill: one grey pill per page that names what the filter shows; tap it for the full filter ── */
.fpill-row { display: flex; align-items: center; gap: 6px; min-width: 0; margin-top: -6px; }
.fpill { display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: min(100%, 560px); padding: 5px 12px 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); font: 500 var(--fs-cap)/1.3 var(--font-ui); cursor: pointer; }
.fpill svg { width: 14px; height: 14px; flex: none; color: var(--faint); }
.fpill .fp-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.fpill .fp-c { color: var(--faint); font-size: calc(10px * var(--tk)); flex: none; }
.fpill:hover { color: var(--fg); border-color: var(--line-strong); }
.fpill.on { color: var(--fg); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: color-mix(in srgb, var(--accent) 7%, var(--panel-2)); }
.fpill.on svg { color: var(--accent); }
.fpill-x { flex: none; width: 26px; height: 26px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; font-size: calc(11px * var(--tk)); }
.fpill-x:hover { color: var(--bad); border-color: var(--line-strong); }
.fpill-row + .filterbar { margin-top: -8px; }
/* the pop-out: the same filter as always, under the pill; the page behind updates as you tap */
.scrim.clear { background: transparent; }
.fpop { position: absolute; z-index: 41; width: min(680px, calc(100vw - 24px)); max-height: 72vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--pop); padding: 14px 16px; display: grid; gap: 10px; }
.fpop:focus { outline: none; }
.fpop-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.fpop-head b { font-size: calc(15px * var(--tk)); }
.fpop-head p { margin: 2px 0 0; }
.fpop .filterbar { border: 0; padding: 0; background: none; box-shadow: none; }
.fpop-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
@media (max-width: 560px) {
  .scrim.clear { background: rgba(10, 14, 22, .32); }
  .fpop { position: fixed; top: auto !important; left: 0 !important; right: 0; bottom: 0; width: auto; max-height: 80vh; border-radius: 16px 16px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .fpill { max-width: calc(100vw - 72px); }
}
/* pinned saved views beside the pill: one tap to look, another to go back */
.fpill-row { flex-wrap: wrap; }
.vpin { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 8px; border-radius: 999px; border: 1px dashed var(--line-strong); background: none; color: var(--muted); font: 500 var(--fs-cap)/1.3 var(--font-ui); cursor: pointer; white-space: nowrap; }
.vpin svg { width: 12px; height: 12px; color: var(--faint); }
.vpin:hover { color: var(--fg); border-color: var(--accent); }
.vpin.on { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.vpin.on svg { color: var(--accent); }
/* simple filters always show; advanced filters fold open */
.adv { border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 8px; }
.adv-toggle { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 2px 0; color: var(--muted); font: 600 var(--fs-cap)/1.3 var(--font-ui); cursor: pointer; justify-self: start; flex-wrap: wrap; text-align: left; }
.adv-toggle .faint { font-weight: 400; }
.adv-toggle:hover { color: var(--fg); }
.adv-toggle .chev { width: 12px; color: var(--faint); }
.adv-body { display: grid; gap: 8px; padding-left: 2px; }
.adv-note { margin: 0; max-width: 70ch; }
.views-row .btn.ghost { color: var(--accent); }
/* domain page: the sections that appear once they have something can be started from here */
.add-more { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 2px 4px; }

/* ── The life timeline: lanes on one time axis, zoomable from a day to three years ── */
:root { --star: #b7791f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --star: #f2c14e; } }
:root[data-theme="dark"] { --star: #f2c14e; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.tl-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tl-tools .seg button { padding: 5px 10px; font-size: var(--fs-cap); }
.tl-span { margin: 8px 0 6px; }
.tl-note { margin: 8px 0 0; }
.tl-scroll { overflow-x: auto; overscroll-behavior-x: contain; border: 1px solid var(--line); border-radius: var(--r-sm); }
.ltl { display: grid; grid-template-columns: 150px minmax(0, 1fr); min-width: 780px; position: relative; }
.tl-corner { grid-column: 1; position: sticky; left: 0; z-index: 5; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.tl-tops, .tl-ticks-h { grid-column: 2; position: relative; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.tl-tops { grid-row: 1; height: 24px; }
.tl-ticks-h { grid-row: 2; height: 26px; }
.tl-q, .tl-m { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding: 0 6px; overflow: hidden; white-space: nowrap; border: 0; border-left: 1px solid var(--line); background: none; color: var(--muted); font: 600 calc(11px * var(--tk))/1 var(--font-ui); text-align: left; }
.tl-m { font-weight: 500; }
.tl-m.strong { color: var(--fg); }
.zoom-month .tl-m, .zoom-week .tl-m { justify-content: center; padding: 0 2px; }
.zoom-3y .tl-m { justify-content: center; padding: 0; }
button.tl-q, button.tl-m { cursor: zoom-in; }
button.tl-q:hover, button.tl-m:hover { color: var(--accent); background: var(--accent-soft); }
.tl-now { position: absolute; bottom: -1px; width: 0; height: 0; margin-left: -6px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--accent); z-index: 3; pointer-events: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tl-grid { grid-column: 2; position: relative; pointer-events: none; z-index: 0; }
.tl-grid i { position: absolute; top: 0; bottom: 0; }
.tl-line { width: 1px; background: var(--line); }
.tl-line.strong { background: var(--line-strong); }
.tl-past { left: 0; background: color-mix(in srgb, var(--fg) 3.5%, transparent); }
.tl-allday { left: 0; background: var(--panel-2); }
.tl-today { width: 2px; margin-left: -1px; background: var(--accent); }
.tl-name { grid-column: 1; position: sticky; left: 0; z-index: 4; display: flex; align-items: flex-start; gap: 6px; padding: 9px 8px 6px 10px; border: 0; border-top: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 600 calc(12.5px * var(--tk))/1.25 var(--font-ui); text-align: left; min-width: 0; }
.tl-name .tl-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.tl-name .dot { margin-top: 3px; }
button.tl-name { cursor: pointer; }
button.tl-name:hover .tl-nm { color: var(--accent); text-decoration: underline; }
.tl-track { grid-column: 2; position: relative; z-index: 1; border-top: 1px solid var(--line); }
.tl-it { position: absolute; height: 24px; display: flex; align-items: center; gap: 5px; border: 0; padding: 0 8px; margin: 0; background: none; color: var(--fg); font: 500 calc(12px * var(--tk))/1 var(--font-ui); white-space: nowrap; cursor: pointer; }
.tl-it:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 3; }
.tl-it:hover { z-index: 3; }
.tl-it:hover .tl-txt { text-decoration: underline; }
.tl-txt { position: relative; z-index: 1; overflow: hidden; text-overflow: ellipsis; }
.tl-time { font-weight: 700; color: var(--muted); }
/* bars: projects, goals, milestones with a start; the solid part is the share of tasks done */
.tl-it.bar { border-radius: 6px; background: color-mix(in srgb, var(--c) 20%, var(--panel)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent); }
.tl-it.bar.inside .tl-txt { max-width: 100%; }
.tl-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px 0 0 6px; background: color-mix(in srgb, var(--c) 48%, var(--panel)); }
.tl-it.bar.outside .tl-txt { position: absolute; left: calc(100% + 6px); }
.tl-it.bar.outside.flip .tl-txt { left: auto; right: calc(100% + 6px); }
.tl-it.bar.clip-l { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.tl-it.bar.clip-r { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.tl-it.bar.open { background: linear-gradient(90deg, color-mix(in srgb, var(--c) 20%, var(--panel)) 70%, transparent); box-shadow: none; }
.tl-it.bar.milestone { height: 18px; margin-top: 3px; border-radius: 4px; }
.tl-end { position: absolute; right: -7px; top: 50%; transform: translateY(-52%); color: var(--c); font-size: calc(14px * var(--tk)); z-index: 2; filter: brightness(.85); }
.tl-star { color: var(--star); font-size: calc(12px * var(--tk)); position: relative; z-index: 1; }
/* markers: a moment on a date; heavier ones are bigger and bolder */
.tl-it.pt { padding: 0; transform: translateX(-7px); }
.tl-it.pt.flip { flex-direction: row-reverse; transform: translateX(calc(-100% + 7px)); }
.tl-mk { width: 14px; flex: none; text-align: center; color: color-mix(in srgb, var(--c) 85%, var(--fg)); font-size: calc(12px * var(--tk)); }
.tl-it.t3 .tl-txt { font-weight: 650; }
.tl-it.t3 .tl-mk { font-size: calc(15px * var(--tk)); }
.tl-it.t0 .tl-txt, .tl-it.t1 .tl-txt { color: var(--muted); }
.tl-it.star .tl-mk, .tl-it.moment .tl-mk { color: var(--star); font-size: calc(16px * var(--tk)); }
.tl-it.crit .tl-mk { color: var(--bad); }
.tl-it.crit.bar { box-shadow: inset 0 0 0 1.5px var(--bad); }
.tl-it.late .tl-txt { color: var(--bad); }
.tl-it.done { opacity: .5; }
.tl-it.done.moment { opacity: 1; }
/* ticks: the lighter things at this zoom, still there and tappable */
.tl-ticks { position: absolute; left: 0; right: 0; bottom: 4px; height: 10px; }
.tl-tick { position: absolute; width: 6px; height: 10px; margin-left: -3px; padding: 0; border: 0; border-radius: 2px; background: color-mix(in srgb, var(--c) 50%, var(--panel)); cursor: pointer; }
.tl-tick:hover, .tl-tick:focus-visible { transform: scaleY(1.5); background: var(--c); outline: none; }
.tl-key.bar { display: inline-block; width: 20px; height: 8px; border-radius: 3px; vertical-align: middle; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 60%, var(--panel)) 55%, color-mix(in srgb, var(--accent) 22%, var(--panel)) 55%); }
.tl-key.now { display: inline-block; width: 2px; height: 12px; vertical-align: middle; background: var(--accent); }
@media (max-width: 560px) { .ltl { grid-template-columns: 104px minmax(0, 1fr); } .tl-name { font-size: calc(11.5px * var(--tk)); padding-left: 6px; } }

/* Google Calendar and Tasks (Settings) */
.glist { margin: 0 0 10px; padding-left: 18px; display: grid; gap: 5px; font-size: var(--fs-cap); color: var(--muted); }
.glist b { color: var(--fg); font-weight: 600; }
.side-g { display: block; margin-top: 4px; font-size: var(--fs-cap); color: var(--muted); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.side-g.warn { color: var(--warn, var(--bad)); text-decoration: underline; }

/* Start with the basics */
.modal.starter { max-width: 620px; }
.st-q { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: start; padding: 6px 0; }
.st-q > span { font-weight: 600; padding-top: 6px; }
.st-preview { border-top: 1px solid var(--line); padding-top: 8px; font-size: var(--fs-cap); }
.st-preview details summary { cursor: pointer; color: var(--accent); }
.st-group { margin-top: 8px; }
.st-group ul { margin: 2px 0 0; padding-left: 18px; }
.st-date { gap: 10px; }
.st-date input { max-width: 170px; }
@media (max-width: 520px) { .st-q { grid-template-columns: 1fr; gap: 4px; } .st-q > span { padding-top: 0; } }

/* ── Customize (beta 11): text size, spacing, corners, fonts, backgrounds; set per person on Customize ── */
:root[data-text="s"] { --tk: .92; } :root[data-text="l"] { --tk: 1.12; } :root[data-text="xl"] { --tk: 1.26; }
:root[data-density="compact"] { --pad: 11px; --gap: 12px; --row-y: 5px; }
:root[data-density="roomy"] { --pad: 22px; --gap: 26px; --row-y: 11px; }
:root[data-corners="sharp"] { --r: 3px; --r-sm: 2px; }
:root[data-corners="round"] { --r: 18px; --r-sm: 12px; }
:root[data-font="clean"] { --font-fig: var(--font-ui); }
:root[data-font="system"] { --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --font-fig: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
:root[data-font="clean"] .kpi .val, :root[data-font="system"] .kpi .val, :root[data-font="clean"] .metric-val { font-weight: 500; }
:root[data-look][data-mode="light"][data-surface="neutral"] { --bg: #f4f4f4; --panel: #ffffff; --panel-2: #f7f7f7; --line: #e3e3e3; --line-strong: #cfcfcf; --fg: #1a1a1a; --muted: #5a5a5a; --faint: #8a8a8a; }
:root[data-look][data-mode="dark"][data-surface="neutral"] { --bg: #101010; --panel: #181818; --panel-2: #1f1f1f; --line: #2b2b2b; --line-strong: #3a3a3a; --fg: #ececec; --muted: #a9a9a9; --faint: #7b7b7b; }
:root[data-look][data-mode="light"][data-surface="warm"] { --bg: #f6f2ec; --panel: #fffdf9; --panel-2: #f9f5ef; --line: #e7dfd3; --line-strong: #d4cabb; --fg: #1f1a14; --muted: #62584b; --faint: #93887a; }
:root[data-look][data-mode="dark"][data-surface="warm"] { --bg: #14110d; --panel: #1c1813; --panel-2: #231e18; --line: #332c23; --line-strong: #42392e; --fg: #eee7dc; --muted: #b4a997; --faint: #877c6b; }
:root[data-look][data-mode="light"][data-surface="contrast"] { --bg: #ffffff; --panel: #ffffff; --panel-2: #f1f1f1; --line: #8f8f8f; --line-strong: #5c5c5c; --fg: #000000; --muted: #2e2e2e; --faint: #4d4d4d; --shadow: none; }
:root[data-look][data-mode="dark"][data-surface="contrast"] { --bg: #000000; --panel: #000000; --panel-2: #121212; --line: #7a7a7a; --line-strong: #a8a8a8; --fg: #ffffff; --muted: #dcdcdc; --faint: #bdbdbd; --shadow: none; }
:root[data-hide-ids] .ref:not(.keep) { display: none; }
:root[data-hide-notes] .card-head .note, :root[data-hide-notes] .legend, :root[data-hide-notes] .wk-note { display: none; }
:root[data-hide-filter] .fpill-row { display: none; }
:root[data-hide-planweek] [data-act="planWeek"] { display: none; }

/* the Customize page */
.cz { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start; }
.cz-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.cz-row:last-child { border-bottom: 0; }
.cz-row > span { font-size: var(--fs-cap); color: var(--muted); font-weight: 600; }
.cz-row .seg { flex-wrap: wrap; }
@media (max-width: 520px) { .cz-row { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.presets { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
.preset { border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 0; background: var(--panel); cursor: pointer; text-align: left; overflow: hidden; color: var(--fg); }
.preset.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.preset .pv { display: grid; grid-template-columns: 1fr 2fr; height: 46px; }
.preset .pv i { display: block; }
.preset .pv b { display: grid; gap: 4px; align-content: center; padding: 0 8px; }
.preset .pv b u { display: block; height: 5px; border-radius: 3px; text-decoration: none; }
.preset span { display: block; padding: 5px 8px 6px; font-size: var(--fs-cap); font-weight: 600; border-top: 1px solid var(--line); }
.swatches { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.swatches .swatch { width: 28px; height: 28px; }
.swatch.on { outline: 2.5px solid var(--fg); outline-offset: 1px; }
.swatch.custom { background: conic-gradient(#e05252, #e0c252, #52e08a, #52b0e0, #8a52e0, #e052b0, #e05252); }
.color-in { width: 44px; height: 30px; padding: 0 2px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--panel); cursor: pointer; }
.cz-list { display: grid; }
.cz-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.cz-item:last-child { border-bottom: 0; }
.cz-item.off .cz-name b { color: var(--faint); font-weight: 500; }
.cz-name { min-width: 0; }
.cz-name b { font-weight: 600; }
.cz-name .cap { display: block; }
.cz-ctl { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.cz-ctl .seg button { padding: 3px 8px; font-size: var(--fs-cap); }
.cz-ctl .sel { width: auto; padding: 4px 8px; font-size: var(--fs-cap); }
@media (max-width: 560px) { .cz-item { grid-template-columns: auto minmax(0, 1fr); } .cz-ctl { grid-column: 1 / -1; justify-content: flex-start; padding-left: 30px; } }
.cz-for { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cz-for .sel { width: auto; }
.quick { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.quick button { text-align: left; display: grid; gap: 3px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--panel); cursor: pointer; color: var(--fg); }
.quick button:hover { border-color: var(--accent); }
.quick button .cap { color: var(--muted); }
.feat { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.feat:last-child { border-bottom: 0; }
.feat input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.feat .cap { display: block; color: var(--muted); }
.feat-group { margin: 10px 0 2px; font-size: var(--fs-cap); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.colorpop { position: absolute; z-index: 42; width: min(300px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--pop); padding: 12px; display: grid; gap: 10px; }
.colorpop .swatches .swatch { width: 30px; height: 30px; }
@media (max-width: 560px) { .colorpop { position: fixed; top: auto !important; left: 0 !important; right: 0; bottom: 0; width: auto; border-radius: 16px 16px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); } }

/* arranging Home in place */
.home-stack { display: grid; gap: var(--gap); min-width: 0; }
.arrange-bar { display: grid; gap: 10px; padding: 12px 14px; border: 1.5px dashed var(--accent); border-radius: var(--r); background: var(--accent-soft); }
.arrange-bar .chips .btn { border-style: dashed; }
.arr { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: space-between; margin: calc(var(--pad) * -.4) 0 10px; padding: 6px 8px; border-radius: var(--r-sm); background: var(--accent-soft); font-size: var(--fs-cap); }
.arr b { font-weight: 700; }
.arr .chips { gap: 4px; }
.arr .btn.sm { padding: 3px 8px; }
.arr .seg button { padding: 3px 8px; font-size: var(--fs-cap); }
.editing .home-card, .editing .kpi-wrap { outline: 1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 3px; }
.kpi-wrap { display: grid; gap: 8px; }
.kpi .kx { float: right; margin: -4px -6px 0 0; border: 0; background: none; color: var(--faint); cursor: pointer; font-size: calc(13px * var(--tk)); }
.kpi .kx:hover { color: var(--bad); }

/* homes: the switcher, the add-a-home dialog, Settings → Homes */
.home-switch { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; margin: -6px 0 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel-2); color: var(--fg); cursor: pointer; text-align: left; font-weight: 600; }
.home-switch:hover { border-color: var(--line-strong); }
.home-switch .hs-n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-switch .hs-c { color: var(--faint); font-size: 11px; }
.hs-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); flex: none; }
.home-chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--fg); cursor: pointer; font: 600 var(--fs-cap)/1.3 var(--font-ui); }
.home-chip:hover { border-color: var(--accent); }
.homes-menu .row { cursor: pointer; border-radius: var(--r-sm); padding-inline: 8px; }
.homes-menu .row:hover { background: var(--panel-2); }
.homes-menu .row.on { background: var(--accent-soft); }
.kind-pick { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.kind-pick label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); cursor: pointer; }
.kind-pick label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.kind-pick input { margin-top: 3px; accent-color: var(--accent); }
.kind-pick .cap { display: block; color: var(--muted); }
/* people: adults added before they have an account */
.person-row { display: grid; grid-template-columns: minmax(0, 220px) auto minmax(0, 1fr); gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.person-row:last-child { border-bottom: 0; }
.person-row .p-act { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
.person-row .invite-box { grid-column: 1 / -1; }
@media (max-width: 560px) { .person-row { grid-template-columns: minmax(0, 1fr) auto; } .person-row .p-act { grid-column: 1 / -1; justify-content: flex-start; } }
.auth-invite { border: 1px solid var(--line); background: var(--accent-soft); border-radius: var(--r); padding: 10px 12px; font-size: var(--fs-cap); }
.ed-more { border-top: 1px dashed var(--line); padding-top: 8px; }
.ed-more summary { cursor: pointer; color: var(--accent); font-size: var(--fs-cap); font-weight: 600; margin-bottom: 8px; }

/* photos and files (beta 11) */
.photo-btn { cursor: pointer; }
.photo-btn svg { flex: none; }
.qa .photo-btn span { display: inline; }
@media (max-width: 420px) { .qa .photo-btn span { display: none; } }
.thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; align-items: center; }
.thumb { width: 64px; height: 64px; padding: 0; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--panel-2); cursor: zoom-in; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.doc { width: auto; min-width: 64px; padding: 0 8px; font-size: var(--fs-cap); color: var(--muted); cursor: pointer; }
.thumb-x { margin-left: -14px; margin-top: -48px; width: 20px; height: 20px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--muted); font-size: 10px; cursor: pointer; padding: 0; z-index: 1; }
.file-missing { font-size: var(--fs-cap); color: var(--faint); }
.photo-scrim { z-index: 50; background: rgba(5, 8, 14, .7); }
.photo-view { position: fixed; inset: 4vh 4vw; z-index: 51; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; background: var(--panel); border-radius: 14px; box-shadow: var(--pop); padding: 10px; }
.photo-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.photo-view img { width: 100%; height: 100%; object-fit: contain; min-height: 0; }
@media (max-width: 560px) { .photo-view { inset: 0; border-radius: 0; padding-top: calc(10px + env(safe-area-inset-top, 0px)); } }
/* Notes */
.notes-tools { display: grid; gap: 10px; }
.notes-jump .chip { text-decoration: none; }
.note-row .note-body { white-space: pre-wrap; font-size: var(--fs-cap); color: var(--muted); margin-top: 4px; max-height: 9.5em; overflow: hidden; overflow-wrap: anywhere; }
.note-row.other .title { font-weight: 500; }
.notes-dom h2 .dot { width: 10px; height: 10px; vertical-align: 1px; }

/* calendars (beta 11.1) */
.cal-pick { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); margin-bottom: 6px; }
.cal-tile { display: grid; gap: 3px; align-content: start; text-align: left; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--panel); color: var(--fg); cursor: pointer; text-decoration: none; font: inherit; }
.cal-tile:hover { border-color: var(--accent); }
.cal-tile.on { border-color: var(--ok, #2f8f6b); background: color-mix(in srgb, var(--ok, #2f8f6b) 7%, var(--panel)); }
.cal-tile[disabled] { opacity: .55; cursor: default; }
.cal-tile .ci { font-size: calc(22px * var(--tk)); line-height: 1; }
.cal-tile .ci .gg { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: #4285f4; color: #fff; font: 700 14px/1 var(--font-ui); }
.cal-tile .cap { color: var(--muted); }
#calendars-card { grid-column: 1 / -1; }
#calendars-card .sub-h { font-size: var(--fs-h); margin: 18px 0 6px; }
.cal-halves { display: grid; gap: 4px 28px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); align-items: start; }
.cal-feed { display: grid; gap: 8px; }
.cal-how summary { cursor: pointer; color: var(--accent); font-size: var(--fs-cap); font-weight: 600; }
.cal-how ol { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.cal-add { display: grid; gap: 8px; margin-top: 8px; }
.cal-add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: end; }
@media (max-width: 560px) { .cal-add-row { grid-template-columns: minmax(0, 1fr); } }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; }
.ent.ext { border-left-style: dashed; background: color-mix(in srgb, var(--c) 10%, var(--panel)); }
.row.ev.ext .title { cursor: pointer; }
